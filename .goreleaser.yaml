# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: nilproof

before:
  hooks:
    - go mod tidy

builds:
  # Pure Go analysis binary: no CGO, so every platform cross-compiles.
  - id: nilproof
    main: ./cmd/nilproof
    binary: nilproof
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mpyw
    name: nilproof
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
